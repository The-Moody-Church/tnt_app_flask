<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}TNT Tracker{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#72253D">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="TNT Tracker">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v={{ config.ASSET_VERSION }}">
</head>
<body class="auth-body">
    <main class="auth-card">
        <img class="auth-logo" src="/static/icon-192.png" alt="" width="72" height="72">
        <h1 class="auth-title">Moody Church T&amp;T</h1>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
